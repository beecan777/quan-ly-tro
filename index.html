<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Điện Nước Phòng Trọ</title>
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for Image Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input, select, textarea {
            user-select: text;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24 antialiased min-h-screen">

    <!-- Header Cố Định Phía Trên -->
    <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-brand-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                    <i class="fa-solid font-bold fa-house-user"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-slate-900">Quản Lý Trọ</h1>
                    <p class="text-xs text-slate-500 font-medium">Bản ghi điện nước hàng tháng</p>
                </div>
            </div>
            
            <!-- Selector Tháng / Năm -->
            <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border border-slate-200">
                <select id="selectMonth" onchange="onPeriodChange()" class="bg-transparent font-semibold text-xs text-slate-700 outline-none pr-1 cursor-pointer">
                    <!-- Javascript sẽ render tháng -->
                </select>
                <span class="text-slate-300 text-xs">/</span>
                <select id="selectYear" onchange="onPeriodChange()" class="bg-transparent font-semibold text-xs text-slate-700 outline-none cursor-pointer">
                    <!-- Javascript sẽ render năm -->
                </select>
            </div>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- TAB 1: NHẬP LIỆU VÀ TÍNH TIỀN -->
        <div id="tab-input" class="space-y-4">
            
            <!-- Thống kê nhanh tháng này -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs text-slate-500 font-medium mb-1">Tổng doanh thu</p>
                    <p id="stat-total-money" class="text-lg font-bold text-brand-600">0 đ</p>
                    <div class="mt-2 text-[11px] text-slate-400 flex items-center gap-1">
                        <i class="fa-solid fa-coins"></i> Tất cả các phòng
                    </div>
                </div>
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs text-slate-500 font-medium mb-1">Tiến độ ghi</p>
                    <p id="stat-progress" class="text-lg font-bold text-slate-800">0/0 phòng</p>
                    <div class="mt-2 text-[11px] text-slate-400 flex items-center gap-1">
                        <i class="fa-solid fa-circle-check text-brand-500"></i> Đã hoàn tất ghi
                    </div>
                </div>
            </div>

            <!-- Nút hành động nhanh -->
            <div class="flex gap-2">
                <button onclick="autoFillPreviousMonthData()" class="flex-1 bg-white hover:bg-slate-50 border border-slate-200 active:scale-95 transition-all text-slate-700 font-semibold text-xs py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-clock-rotate-left text-brand-600"></i>
                    Lấy số tháng trước
                </button>
            </div>

            <!-- Danh sách các phòng -->
            <div id="room-list-container" class="space-y-3">
                <!-- Javascript sẽ render danh sách phòng ở đây -->
            </div>
        </div>

        <!-- TAB 2: CÀI ĐẶT ĐƠN GIÁ & DỊCH VỤ -->
        <div id="tab-settings" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="font-bold text-slate-900 border-b border-slate-100 pb-2.5 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-brand-600"></i> Đơn Giá Điện Nước Mặc Định
                </h2>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1">Giá Điện (VNĐ / kWh)</label>
                        <div class="relative">
                            <input type="number" id="setting-price-electric" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold text-slate-800 focus:outline-none focus:border-brand-500 pl-8" placeholder="3500">
                            <i class="fa-solid fa-bolt absolute left-3 top-3 text-slate-400 text-xs"></i>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1">Giá Nước (VNĐ / m³)</label>
                        <div class="relative">
                            <input type="number" id="setting-price-water" class="w-full bg-slate-5
